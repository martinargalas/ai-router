# Prometheus config for the bundled observability profile.
# Only used when you start the stack with --profile observability.
# If you already run Prometheus elsewhere, ignore this file and use
# ai-router-scrape-job.yml + ai-router-rules.yml instead.

global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/ai-router-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['ai-router-alertmanager:9093']

scrape_configs:
  - job_name: 'ai-router-litellm'
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-router-litellm:4000']
        labels:
          service: 'ai-router'
