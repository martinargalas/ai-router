# ai-router — self-hosted AI gateway for a development team
#
#     docker compose --env-file .env up -d
#
# Secrets come from .env. Never put them in this file — it is committed.

services:
  ai-router-db:
    image: postgres:16-alpine
    container_name: ai-router-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ai-router-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-router-redis:
    image: redis:7-alpine
    container_name: ai-router-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Push notifications for budget and outage alerts.
  # Subscribe to the "ai-router-budget" topic in the ntfy app.
  ai-router-ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ai-router-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://localhost:8080
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ai-router-ntfy-cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-router-alertmanager:
    image: prom/alertmanager:latest
    container_name: ai-router-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
      - ai-router-alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Prometheus and Grafana come preconfigured: scrape job, alert rules,
  # datasources and all three dashboards load on startup.
  #
  # Already running your own? Delete these two services and point your instance
  # at the gateway instead — see the headers of the files in prometheus/.
  ai-router-prometheus:
    image: prom/prometheus:latest
    container_name: ai-router-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/prometheus/ai-router-rules.yml
        target: /etc/prometheus/ai-router-rules.yml
        read_only: true
      - ai-router-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  ai-router-grafana:
    image: grafana/grafana-oss:latest
    container_name: ai-router-grafana
    restart: unless-stopped
    depends_on:
      - ai-router-prometheus
    environment:
      # Change this. Grafana is bound to localhost only, but still.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Used by the provisioned Postgres datasource. Create the role with
      # sql/grafana-readonly-user.sql; without it only the Prometheus
      # dashboard works.
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:-}
    volumes:
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/grafana/provisioned
        target: /etc/grafana/dashboards
        read_only: true
      - ai-router-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

  ai-router-litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ai-router-litellm
    restart: unless-stopped
    depends_on:
      ai-router-db:
        condition: service_healthy
      ai-router-redis:
        condition: service_healthy
      ai-router-ntfy:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@ai-router-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      STORE_MODEL_IN_DB: "False"
      # Redis holds shared state: rate limits, budget counters, router state.
      # Without it these are enforced per worker and spend can overshoot.
      REDIS_HOST: ai-router-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # NOTE: LiteLLM's built-in budget alerts did not fire in the version
      # tested (1.98.0) — budget_alerts() is defined but never called. Real
      # alerting goes through Prometheus + Alertmanager. Left wired for the day
      # upstream fixes it.
      WEBHOOK_URL: http://ai-router-ntfy/ai-router-budget
    volumes:
      - type: bind
        source: ${AI_ROUTER_DIR:?set AI_ROUTER_DIR}/config/litellm-config.yaml
        target: /app/config.yaml
        read_only: true
    ports:
      # Bound to localhost only. That is what makes it safe to serve /metrics
      # without auth — reachable from Docker networks and this host, not the LAN.
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ai-router-db-data:
    name: ai-router-db-data
  ai-router-ntfy-cache:
    name: ai-router-ntfy-cache
  ai-router-alertmanager-data:
    name: ai-router-alertmanager-data
  ai-router-prometheus-data:
    name: ai-router-prometheus-data
  ai-router-grafana-data:
    name: ai-router-grafana-data

networks:
  default:
    name: ai-router-net
